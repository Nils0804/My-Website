<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Kontakt zu Nils Karpf für Projekte, Kooperationen und Creator-Work.">
  <title>Kontakt | Nils Karpf</title>
  <link rel="stylesheet" href="./styles/style.css">
  <script defer src="./scripts/main.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="container header-row">
      <a class="brand" href="./index.html">NK</a>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="main-nav">Menue</button>
      <nav id="main-nav" class="main-nav" aria-label="Hauptnavigation">
        <a href="./index.html">Startseite</a>
        <a href="./arbeit.html">Arbeit</a>
        <a href="./ueber-mich.html">Über mich</a>
        <a class="active" href="./Kontakt.html">Kontakt</a>
      </nav>
      <div class="header-social" aria-label="Social Links">
        <a href="https://instagram.com" target="_blank" rel="noreferrer">IG</a>
        <a href="https://tiktok.com" target="_blank" rel="noreferrer">TT</a>
      </div>
    </div>
  </header>

  <main>
    <section class="page-hero page-hero-contact">
      <div class="container hero-content" data-reveal>
        <h1>Kontakt</h1>
      </div>
    </section>

    <section class="section">
    <div class="container">
      <section class="contact-wrap">
        <form class="contact-form" action="mailto:nilskarpf@outlook.com" method="post" enctype="text/plain" data-reveal>
          <div class="form-row">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" placeholder="Dein Name" required>
          </div>

          <div class="form-row">
            <label for="email">E-Mail</label>
            <input type="email" id="email" name="email" placeholder="name@example.com" required>
          </div>

          <div class="form-row">
            <label for="nachricht">Nachricht</label>
            <textarea id="nachricht" name="nachricht" placeholder="Erzähl mir von deinem Projekt..." required></textarea>
          </div>

          <button class="btn btn-primary" type="submit">Nachricht senden</button>
        </form>

        <aside class="contact-media" data-reveal>
          <video src="./videos/v24044gl0000d689igfog65nrvnp6ei0.mp4" autoplay muted loop playsinline></video>
          <h3>Direkter Kontakt</h3>
          <p>E-Mail: Nils.Karpf@bluewin.ch</p>
          <p>Telefonnummer: 077 456 02 55</p>
        </aside>

      </section>
    </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">&copy; <span id="year"></span> Nils Karpf</div>
  </footer>
</body>
</html>
